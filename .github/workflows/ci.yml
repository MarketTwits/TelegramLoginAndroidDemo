name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests and image
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Run backend tests
        run: npm test

      - name: Build production image
        run: docker build --build-arg "BUILD_REVISION=$GITHUB_SHA" --tag telegram-bloom-backend:ci .

  publish-backend:
    name: Publish backend to GHCR
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [ backend, infrastructure ]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set image name
        id: image
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/$owner/telegramlogindemo" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Verify published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" |
            jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] |
              (index("amd64") != null and index("arm64") != null)'

          docker pull --platform linux/amd64 "$IMAGE@$DIGEST"
          docker run --detach --name backend-publish-smoke \
            --env NODE_ENV=production --env APP_TOKEN=ci-publish-check \
            --publish 127.0.0.1:18080:8080 "$IMAGE@$DIGEST"
          trap 'docker rm --force backend-publish-smoke >/dev/null' EXIT

          for attempt in $(seq 1 30); do
            response="$(curl --silent --fail \
              --header 'X-App-Token: ci-publish-check' \
              http://127.0.0.1:18080/api/health/ready || true)"
            if [[ -n "$response" ]] &&
              jq -e --arg revision "$GITHUB_SHA" \
                '.status == "ready" and .revision == $revision and .apiVersion == 8' \
                <<< "$response" >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs backend-publish-smoke >&2
          exit 1

      - name: Record published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          echo "Published \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit tag: \`$IMAGE:sha-$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"

  infrastructure:
    name: Infrastructure and scripts validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose
        run: |
          APP_TOKEN=ci-validation-token docker compose config --quiet
          APP_TOKEN=ci-validation-token BACKEND_IMAGE=ghcr.io/example/backend:sha-0123456789abcdef0123456789abcdef01234567 \
            docker compose -f compose.production.yaml config --quiet

      - name: Validate shell scripts syntax
        run: find scripts -type f -name "*.sh" -print0 | xargs -0 -n 1 bash -n

  android:
    name: Android tests and lint
    runs-on: ubuntu-24.04
    env:
      # Build-time placeholders only. A real release uses protected environment secrets.
      TELEGRAM_CLIENT_ID: "000000000"
      TELEGRAM_REDIRECT_HOST: ci-login.tg.dev
      TELEGRAM_BACKEND_URL: https://example.invalid
      APP_TOKEN: "ci-dummy-token"
      GITHUB_USERNAME: ${{ vars.PACKAGES_USERNAME }}
      GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Validate package credentials
        run: |
          test -n "$GITHUB_USERNAME"
          test -n "$GITHUB_TOKEN"

      - name: Run Android tests and lint
        run: ./gradlew testDebugUnitTest lintDebug lintVitalRelease --no-daemon --warning-mode all

      - name: Archive Gradle problems report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-problems-report
          path: build/reports/problems/
          if-no-files-found: ignore

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
