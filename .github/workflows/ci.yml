name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests and image
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Build production image
        run: docker build --build-arg "BUILD_REVISION=$GITHUB_SHA" --tag telegram-bloom-backend:ci .

  android:
    name: Android tests and lint
    runs-on: ubuntu-24.04
    env:
      # Build-time placeholders only. A real release uses protected environment secrets.
      TELEGRAM_CLIENT_ID: "000000000"
      TELEGRAM_REDIRECT_HOST: ci-login.tg.dev
      TELEGRAM_BACKEND_URL: https://example.invalid
      APP_TOKEN: "ci-dummy-token"
      GITHUB_USERNAME: ${{ vars.PACKAGES_USERNAME }}
      GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Validate package credentials
        run: |
          test -n "$GITHUB_USERNAME"
          test -n "$GITHUB_TOKEN"

      - name: Run Android tests and lint
        run: ./gradlew testDebugUnitTest lintDebug lintVitalRelease --no-daemon
