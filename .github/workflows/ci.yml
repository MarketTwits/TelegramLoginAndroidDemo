name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests and image
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Run backend tests
        run: npm test

      - name: Build production image
        run: docker build --build-arg "BUILD_REVISION=$GITHUB_SHA" --tag telegram-bloom-backend:ci .

  infrastructure:
    name: Infrastructure and scripts validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate shell scripts syntax
        run: find scripts -type f -name "*.sh" -print0 | xargs -0 -n 1 bash -n

  android:
    name: Android tests and lint
    runs-on: ubuntu-24.04
    env:
      # Build-time placeholders only. A real release uses protected environment secrets.
      TELEGRAM_CLIENT_ID: "000000000"
      TELEGRAM_REDIRECT_HOST: ci-login.tg.dev
      TELEGRAM_BACKEND_URL: https://example.invalid
      APP_TOKEN: "ci-dummy-token"
      GITHUB_USERNAME: ${{ vars.PACKAGES_USERNAME }}
      GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Validate package credentials
        run: |
          test -n "$GITHUB_USERNAME"
          test -n "$GITHUB_TOKEN"

      - name: Run Android tests and lint
        run: ./gradlew testDebugUnitTest lintDebug lintVitalRelease --no-daemon --warning-mode all

      - name: Archive Gradle problems report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-problems-report
          path: build/reports/problems/
          if-no-files-found: ignore

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
