name: Deploy production backend

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-bloom-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy selected main revision
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_APP_DIRECTORY: ${{ secrets.DEPLOY_APP_DIRECTORY }}
      DEPLOY_STACK_DIRECTORY: ${{ secrets.DEPLOY_STACK_DIRECTORY }}
      DEPLOY_LOCAL_HEALTH_URL: ${{ secrets.DEPLOY_LOCAL_HEALTH_URL }}
      PRODUCTION_HEALTH_URL: ${{ secrets.PRODUCTION_HEALTH_URL }}
      APP_TOKEN: ${{ secrets.APP_TOKEN }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Test backend
        working-directory: backend
        run: |
          npm ci
          npm test
          docker build --build-arg "BUILD_REVISION=$GITHUB_SHA" --tag telegram-bloom-backend:deploy-check .

      - name: Validate deployment configuration
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_APP_DIRECTORY"
          test -n "$DEPLOY_STACK_DIRECTORY"
          test -n "$DEPLOY_LOCAL_HEALTH_URL"
          test -n "$PRODUCTION_HEALTH_URL"
          test -n "$APP_TOKEN"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"

      - name: Configure SSH
        run: |
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/deploy_key"
          chmod 600 "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"

      - name: Deploy exact commit
        env:
          REVISION: ${{ github.sha }}
        run: |
          app_directory="$(printf '%s' "$DEPLOY_APP_DIRECTORY" | base64 -w 0)"
          stack_directory="$(printf '%s' "$DEPLOY_STACK_DIRECTORY" | base64 -w 0)"
          local_health_url="$(printf '%s' "$DEPLOY_LOCAL_HEALTH_URL" | base64 -w 0)"
          encoded_app_token="$(printf '%s' "$APP_TOKEN" | base64 -w 0)"
          ssh \
            -i "$RUNNER_TEMP/ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$REVISION' '$app_directory' '$stack_directory' '$local_health_url' '$encoded_app_token'" \
            < scripts/deploy-production.sh

      - name: Verify public endpoint
        env:
          REVISION: ${{ github.sha }}
        run: |
          response="$(curl --fail --silent --show-error \
            -H "X-App-Token: $APP_TOKEN" \
            --retry 8 --retry-all-errors --retry-delay 3 \
            "$PRODUCTION_HEALTH_URL")"
          printf '%s\n' "$response"
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"ready"' <<< "$response"
          grep -Eq '"apiVersion"[[:space:]]*:[[:space:]]*6' <<< "$response"
          grep -Fq "\"revision\":\"$REVISION\"" <<< "$response"
