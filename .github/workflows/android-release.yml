name: Publish Android release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the GitHub release as a pre-release
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: telegram-bloom-android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify, and publish signed APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: android-release
    steps:
      - name: Check out selected main revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Validate release secrets
        shell: bash
        env:
          TELEGRAM_CLIENT_ID: ${{ secrets.TELEGRAM_CLIENT_ID }}
          TELEGRAM_REDIRECT_HOST: ${{ secrets.TELEGRAM_REDIRECT_HOST }}
          TELEGRAM_BACKEND_URL: ${{ secrets.TELEGRAM_BACKEND_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_SHA256: ${{ secrets.ANDROID_SIGNING_SHA256 }}
          GITHUB_USERNAME: ${{ vars.PACKAGES_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_CLIENT_ID"
          test -n "$TELEGRAM_REDIRECT_HOST"
          test -n "$TELEGRAM_BACKEND_URL"
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          url = urlsplit(os.environ['TELEGRAM_BACKEND_URL'])
          if url.scheme != 'https' or not url.hostname or url.username or url.password or url.query or url.fragment:
              raise SystemExit('Release backend URL must be an HTTPS URL without credentials, query, or fragment.')
          PY
          test -n "$APP_TOKEN"
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_SIGNING_SHA256"
          test -n "$GITHUB_USERNAME"
          test -n "$GITHUB_TOKEN"

      - name: Restore signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/android-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Validate keystore and alias
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore "$ANDROID_KEYSTORE_FILE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Test and build signed release APK
        env:
          TELEGRAM_CLIENT_ID: ${{ secrets.TELEGRAM_CLIENT_ID }}
          TELEGRAM_REDIRECT_HOST: ${{ secrets.TELEGRAM_REDIRECT_HOST }}
          TELEGRAM_BACKEND_URL: ${{ secrets.TELEGRAM_BACKEND_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GITHUB_USERNAME: ${{ vars.PACKAGES_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: ./gradlew testDebugUnitTest lintVitalRelease assembleRelease --no-daemon

      - name: Locate and verify signed APK
        id: apk
        shell: bash
        env:
          ANDROID_SIGNING_SHA256: ${{ secrets.ANDROID_SIGNING_SHA256 }}
          TELEGRAM_BACKEND_URL: ${{ secrets.TELEGRAM_BACKEND_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Ensure the released commit is strictly part of origin/main
          git fetch --quiet --prune origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

          mapfile -t apks < <(find app/build -type f -name '*release*.apk' | sort)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            printf 'Expected exactly one release APK, found %s:\n' "${#apks[@]}" >&2
            printf '%s\n' "${apks[@]}" >&2
            exit 1
          fi

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "${apks[0]}"

          actual_sha256="$("$apksigner" verify --print-certs "${apks[0]}" \
            | sed -n -E 's/^.*certificate SHA-256 digest: //p' \
            | head -n 1 \
            | tr -d ':[:space:]' \
            | tr '[:upper:]' '[:lower:]')"
          expected_sha256="$(printf '%s' "$ANDROID_SIGNING_SHA256" \
            | tr -d ':[:space:]' \
            | tr '[:upper:]' '[:lower:]')"
          [[ -n "$actual_sha256" && "$actual_sha256" == "$expected_sha256" ]]

          # Verify application package and manifest metadata via apkanalyzer
          apkanalyzer="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1 || true)"
          if [[ -x "$apkanalyzer" ]]; then
            app_id="$("$apkanalyzer" manifest application-id "${apks[0]}")"
            [[ "$app_id" == "com.markettwits.devx.tgsignin" ]]
          fi

          # Check the packaged DEX rather than only the Gradle build configuration.
          python3 - "${apks[0]}" <<'PY'
          import os
          import sys
          import zipfile

          expected = os.environ['TELEGRAM_BACKEND_URL'].encode('utf-8') + b'\x00'
          with zipfile.ZipFile(sys.argv[1]) as apk:
              dex_files = [name for name in apk.namelist() if name.endswith('.dex')]
              if not any(expected in apk.read(name) for name in dex_files):
                  raise SystemExit('Signed APK does not contain the configured backend URL.')
          print('Verified backend URL in signed APK.')
          PY

          metadata="app/build/outputs/apk/release/output-metadata.json"
          test -f "$metadata"
          version_name="$(jq -r '.elements[0].versionName' "$metadata")"
          version_code="$(jq -r '.elements[0].versionCode' "$metadata")"
          [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]]

          tag="$version_name.$version_code"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists." >&2
            exit 1
          fi

          release_apk="$RUNNER_TEMP/TelegramLoginAndroidDemo-$version_name.apk"
          cp "${apks[0]}" "$release_apk"
          sha256sum "$release_apk" | awk '{print $1}' > "$release_apk.sha256"
          apk_sha256="$(cat "$release_apk.sha256")"

          echo "path=$release_apk" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$release_apk.sha256" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$apk_sha256" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Attest APK build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.checksum_path }}

      - name: Publish GitHub release with generated changelog
        shell: bash
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          CHECKSUM_PATH: ${{ steps.apk.outputs.checksum_path }}
          APK_SHA256: ${{ steps.apk.outputs.apk_sha256 }}
          SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_SHA256 }}
          MIN_BACKEND_API_VERSION: "8"
          RELEASE_TAG: ${{ steps.apk.outputs.tag }}
          RELEASE_VERSION_NAME: ${{ steps.apk.outputs.version_name }}
          PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_notes="$RUNNER_TEMP/release-notes.md"
          scripts/generate-release-notes.sh "$RELEASE_TAG" "$release_notes"

          release_flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" "$APK_PATH" "$CHECKSUM_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$RELEASE_VERSION_NAME" \
            --notes-file "$release_notes" \
            "${release_flags[@]}"
